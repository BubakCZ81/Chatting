<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat — Local AI</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-panel: #171a23;
    --bg-input: #1e2230;
    --bg-hover: #262b3d;
    --border: #2a3042;
    --text: #e6e9f0;
    --text-dim: #9aa3b5;
    --accent: #6c8cff;
    --accent-hover: #869fff;
    --danger: #ff5c6c;
    --danger-hover: #ff7684;
    --success: #3ddc84;
    --user-bubble: #35507e;
    --ai-bubble: #22273a;
    --shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    --bg: #f4f6fa;
    --bg-panel: #ffffff;
    --bg-input: #eef1f7;
    --bg-hover: #e3e8f2;
    --border: #d8deea;
    --text: #1c2230;
    --text-dim: #5d6a82;
    --accent: #4b6fe8;
    --accent-hover: #3a5ed6;
    --danger: #e2455a;
    --danger-hover: #c93249;
    --success: #1fa860;
    --user-bubble: #d7e3fb;
    --ai-bubble: #eef1f7;
    --shadow: 0 8px 24px rgba(30,40,70,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .25s, color .25s;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin-right: 6px;
    white-space: nowrap;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex-shrink: 0; transition: background .2s; }
  .dot.on { background: var(--success); box-shadow: 0 0 8px var(--success); }
  select, button, input[type="text"] {
    font: inherit;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  select { padding: 7px 10px; min-width: 220px; cursor: pointer; }
  button { padding: 7px 16px; cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; }
  button:hover:not(:disabled) { background: var(--bg-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #btnConnect { border-color: var(--accent); color: var(--accent); }
  #btnConnect:hover:not(:disabled) { background: var(--accent); color: #fff; }
  #btnDisconnect { border-color: var(--danger); color: var(--danger); }
  #btnDisconnect:hover:not(:disabled) { background: var(--danger); color: #fff; }
  #btnRefresh { padding: 7px 11px; }
  #status {
    font-size: 13px;
    color: var(--text-dim);
    margin-left: auto;
    white-space: nowrap;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: min(760px, 82%);
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .row.ai .bubble { background: var(--ai-bubble); border-bottom-left-radius: 4px; }
  .stats {
    max-width: min(760px, 82%);
    font-size: 12px;
    color: var(--text-dim);
    padding: 2px 6px;
    font-variant-numeric: tabular-nums;
  }
  .row.ai .col { display: flex; flex-direction: column; gap: 4px; max-width: min(760px, 82%); }
  .row.ai .col .bubble, .row.ai .col .stats { max-width: 100%; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: text-bottom; animation: blink .9s infinite; border-radius: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .system-note { text-align: center; color: var(--text-dim); font-size: 13px; }
  .system-note.error { color: var(--danger); }
  footer {
    padding: 14px 18px 16px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
  }
  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #msgInput {
    flex: 1;
    resize: none;
    padding: 11px 14px;
    border-radius: 10px;
    max-height: 160px;
    min-height: 44px;
    line-height: 1.45;
    font: inherit;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    outline: none;
  }
  #msgInput:focus { border-color: var(--accent); }
  #btnSend { background: var(--accent); color: #fff; border: 1px solid var(--accent); padding: 11px 20px; border-radius: 10px; }
  #btnSend:hover:not(:disabled) { background: var(--accent-hover); }
  #btnStop { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 11px 18px; border-radius: 10px; }
  #btnStop:hover:not(:disabled) { background: var(--danger); color: #fff; }
  .hint { margin-top: 7px; font-size: 11.5px; color: var(--text-dim); text-align: center; }
  #btnTheme {
    padding: 6px 10px;
    font-size: 15px;
    line-height: 1;
  }
  #btnTerminal.on {
    border-color: var(--accent);
    color: var(--accent);
  }
  #terminal {
    background: #0b0e14;
    border-top: 1px solid var(--border);
    font-family: Consolas, "Cascade Mono", "Courier New", monospace;
    font-size: 13px;
    flex-shrink: 0;
    max-height: 42vh;
    display: flex;
    flex-direction: column;
  }
  #terminal.open { flex: 0 1 auto; }
  #termHead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    color: #9aa3b5;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  #termHead .ttitle { font-weight: 600; color: #e6e9f0; }
  #termHead .tsub { font-size: 11.5px; }
  #termHead .ttoggle { margin-left: auto; }
  #termBody {
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  #terminal.open #termBody { display: flex; }
  #termOut {
    flex: 1;
    overflow-y: auto;
    padding: 6px 14px;
    color: #c8d0e0;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
    min-height: 60px;
  }
  #termOut .t-err { color: #ff5c6c; }
  #termOut .t-ok { color: #3ddc84; }
  #termOut .t-dim { color: #6d7689; }
  #termOut .t-cmd { color: #8ca4ff; }
  #termLine {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px 9px;
    flex-shrink: 0;
  }
  #termLine .tprompt { color: #3ddc84; white-space: nowrap; }
  #termIn {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e6e9f0;
    font: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>🗨 Ollama Chat</h1>
  <div class="dot" id="dot"></div>
  <select id="modelSelect" title="Models available in Ollama"><option>Loading models…</option></select>
  <button id="btnRefresh" title="Re-run ollama list">↻</button>
  <button id="btnConnect">Connect</button>
  <button id="btnDisconnect" disabled>Disconnect</button>
  <button id="btnTheme" title="Toggle light / dark theme">🌙</button>
  <button id="btnTerminal" title="Open / close the Ollama terminal">⌨ Terminal</button>
  <span id="status">Not connected</span>
</header>

<div id="chat">
  <div class="system-note">Pick a model, press <b>Connect</b>, and start chatting with your local AI.</div>
</div>

<div id="terminal">
  <div id="termHead" title="Click to open / close the terminal">
    <span class="ttitle">⌨ Terminal</span>
    <span class="tsub">ollama list · ps · pull · rm · cp · push · show · run · version</span>
    <span class="ttoggle" id="termToggleLabel">open ▲</span>
  </div>
  <div id="termBody">
    <div id="termOut"></div>
    <div id="termLine">
      <span class="tprompt">ollama&gt;</span>
      <input id="termIn" autocomplete="off" spellcheck="false" placeholder="type a command — 'help' for the list">
    </div>
  </div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="btnSend">Send</button>
    <button id="btnStop" disabled>■ Stop</button>
  </div>
  <div class="hint">Runs fully offline against your local Ollama instance (default http://localhost:11434)</div>
</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);
const chatEl = $("chat"),
      modelSelect = $("modelSelect"),
      msgInput = $("msgInput"),
      btnSend = $("btnSend"),
      btnStop = $("btnStop"),
      btnConnect = $("btnConnect"),
      btnDisconnect = $("btnDisconnect"),
      btnRefresh = $("btnRefresh"),
      btnTheme = $("btnTheme"),
      statusEl = $("status"),
      dotEl = $("dot");

const DEFAULT_URL = "http://localhost:11434";
let ollamaUrl = DEFAULT_URL;
let connected = false;
let currentModel = null;
let history = [];          // [{role, content}]
let generating = false;
let controller = null;     // AbortController for the active generation
let activeStats = null;    // live token-rate tracker for current answer

/* ---------- theme ---------- */
const savedTheme = localStorage.getItem("oc-theme") || "dark";
applyTheme(savedTheme);
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  btnTheme.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("oc-theme", t);
}
btnTheme.addEventListener("click", () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ---------- status helpers ---------- */
function setStatus(text, ok) {
  statusEl.textContent = text;
  dotEl.classList.toggle("on", !!ok);
}
function setConnectedUI(on) {
  connected = on;
  btnConnect.disabled = on;
  btnDisconnect.disabled = !on;
  modelSelect.disabled = on;
}

/* ---------- model listing (equivalent of `ollama list`) ---------- */
async function listModels() {
  setStatus("Loading models…", false);
  modelSelect.innerHTML = "";
  try {
    const res = await fetch(`${ollamaUrl}/api/tags`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const models = (data.models || []).sort((a, b) => a.name.localeCompare(b.name));
    if (!models.length) {
      modelSelect.appendChild(new Option("No models — run: ollama pull <model>", ""));
      setStatus("No models installed", false);
      btnConnect.disabled = true;
      return;
    }
    for (const m of models) {
      const size = m.size ? ` (${(m.size / 1e9).toFixed(1)} GB)` : "";
      modelSelect.appendChild(new Option(m.name + size, m.name));
    }
    setStatus(`${models.length} model${models.length > 1 ? "s" : ""} available`, false);
    btnConnect.disabled = connected;
  } catch (err) {
    modelSelect.appendChild(new Option("⚠ Cannot reach Ollama", ""));
    btnConnect.disabled = true;
    setStatus("Ollama unreachable — is it running?", false);
    addNote(`Could not reach Ollama at ${ollamaUrl} (${err.message}). ` +
      `Start it with \`ollama serve\`. If the page is opened from a file, also allow web access: ` +
      `set the environment variable OLLAMA_ORIGINS=* and restart Ollama.`, true);
  }
}

/* ---------- connect / disconnect ---------- */
async function preloadModel(model) {
  const res = await fetch(`${ollamaUrl}/api/generate`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, prompt: "", keep_alive: -1 })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  await res.json();
}

btnConnect.addEventListener("click", async () => {
  const model = modelSelect.value;
  if (!model) return;
  currentModel = model;
  setStatus(`Loading “${model}” into memory…`, false);
  btnConnect.disabled = true;
  try {
    await preloadModel(model);
    setConnectedUI(true);
    setStatus(`Connected to ${model}`, true);
    addNote(`Connected to <b>${model}</b>.`);
  } catch (err) {
    setStatus("Connection failed", false);
    btnConnect.disabled = false;
    addNote(`Failed to load “${model}”: ${err.message}`, true);
  }
});

btnDisconnect.addEventListener("click", async () => {
  const model = currentModel;
  setStatus(`Unloading “${model}” from memory…`, false);
  try {
    await fetch(`${ollamaUrl}/api/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, prompt: "", keep_alive: 0 })
    });
    addNote(`Disconnected — model <b>${model}</b> unloaded from memory.`);
  } catch (err) {
    addNote(`Disconnect warning: ${err.message}`, true);
  }
  if (history.length) history = [];
  currentModel = null;
  setConnectedUI(false);
  setStatus("Not connected", false);
});

btnRefresh.addEventListener("click", () => { if (!connected) listModels(); });

/* ---------- chat UI helpers ---------- */
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function addUserBubble(text) {
  const row = document.createElement("div");
  row.className = "row user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollDown();
}
function addAiBubble() {
  const row = document.createElement("div");
  row.className = "row ai";
  const col = document.createElement("div");
  col.className = "col";
  const b = document.createElement("div");
  b.className = "bubble";
  const cur = document.createElement("span");
  cur.className = "cursor";
  b.appendChild(cur);
  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = "Generating…";
  col.appendChild(b);
  col.appendChild(stats);
  row.appendChild(col);
  chatEl.appendChild(row);
  scrollDown();
  return { textEl: b, cursor: cur, statsEl: stats };
}
function addNote(html, isError) {
  const n = document.createElement("div");
  n.className = "system-note" + (isError ? " error" : "");
  n.innerHTML = html;
  chatEl.appendChild(n);
  scrollDown();
}

/* ---------- token-rate tracking ---------- */
function newStats() {
  return { t0: null, lastT: 0, tokens: 0, rates: [] };
}
function recordTokens(st, n) {
  if (n <= 0) return;
  const now = performance.now();
  if (st.t0 === null) { st.t0 = now; st.lastT = now; }
  const dt = now - st.lastT;
  st.tokens += n;
  if (dt >= 5) {
    st.rates.push(n / (dt / 1000));
    st.lastT = now;
  }
}
function liveLabel(st) {
  if (!st.t0 || st.tokens === 0) return "Generating…";
  const el = (st.lastT - st.t0) / 1000;
  const avg = st.tokens / Math.max(el, 1e-6);
  return `${st.tokens} tokens · ${avg.toFixed(1)} tok/s …`;
}
function finalizeStats(st, finalChunk, stopped) {
  let avg, min, max;
  if (finalChunk && finalChunk.eval_count > 0 && finalChunk.eval_duration > 0) {
    avg = finalChunk.eval_count / (finalChunk.eval_duration / 1e9);
  } else if (st.t0 && st.tokens > 0) {
    avg = st.tokens / Math.max((st.lastT - st.t0) / 1000, 1e-6);
  } else {
    avg = 0;
  }
  const rates = st.rates.slice(1);
  if (rates.length) {
    min = Math.min(...rates);
    max = Math.max(...rates);
  } else {
    min = max = avg;
  }
  const f = x => x.toFixed(1);
  const head = stopped ? "⏹ stopped · " : "";
  return `${head}Speed: min ${f(min)} · avg ${f(avg)} · max ${f(max)} tok/s` +
         (st.tokens ? ` · ${st.tokens} tokens` : "");
}

/* ---------- streaming chat with stop ---------- */
async function sendMessage(text) {
  addUserBubble(text);
  history.push({ role: "user", content: text });

  const ui = addAiBubble();
  generating = true;
  btnSend.disabled = true;
  btnStop.disabled = false;
  controller = new AbortController();
  const st = newStats();
  activeStats = st;
  let full = "";
  let finalChunk = null;
  let stopped = false;
  let statsTimer = setInterval(() => { ui.statsEl.textContent = liveLabel(activeStats); }, 250);

  try {
    const res = await fetch(`${ollamaUrl}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: currentModel, messages: history, stream: true }),
      signal: controller.signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const data = JSON.parse(line);
        if (data.message && data.message.content) {
          const piece = data.message.content;
          full += piece;
          recordTokens(activeStats, 1);
          ui.textEl.textContent = full;
          scrollDown();
        }
        if (data.done) {
          finalChunk = data;
        }
      }
    }
  } catch (err) {
    if (err.name === "AbortError") {
      stopped = true;
    } else {
      addNote(`Generation failed: ${err.message}`, true);
    }
  } finally {
    clearInterval(statsTimer);
    generating = false;
    controller = null;
    activeStats = null;
    ui.cursor.remove();
    btnSend.disabled = false;
    btnStop.disabled = true;

    if (full) {
      history.push({ role: "assistant", content: full });
      ui.textEl.textContent = full;
    } else if (stopped) {
      ui.textEl.textContent = "— generation stopped before any output —";
    }
    ui.statsEl.textContent = finalizeStats(st, finalChunk, stopped);
    scrollDown();
  }
}

/* ---------- input handling ---------- */
btnSend.addEventListener("click", trySend);
btnStop.addEventListener("click", () => { if (controller) controller.abort(); });
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    trySend();
  }
});
function trySend() {
  const text = msgInput.value.trim();
  if (!text || generating) return;
  if (!connected || !currentModel) {
    addNote("Not connected — choose a model and press <b>Connect</b> first.", true);
    return;
  }
  msgInput.value = "";
  msgInput.style.height = "auto";
  sendMessage(text);
}
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + "px";
});

/* ---------- terminal ---------- */
const termEl = $("terminal"),
      termHead = $("termHead"),
      termOut = $("termOut"),
      termIn = $("termIn"),
      btnTerminal = $("btnTerminal"),
      termToggleLabel = $("termToggleLabel");
let termOpen = false;
let termWelcomed = false;
const termHistory = [];
let termHistIdx = -1;

function setTerm(open) {
  termOpen = open;
  termEl.classList.toggle("open", open);
  btnTerminal.classList.toggle("on", open);
  termToggleLabel.textContent = open ? "close ▼" : "open ▲";
  if (open) {
    if (!termWelcomed) {
      termWelcomed = true;
      tprint("Ollama terminal ready — type 'help' to see available commands.", "t-dim");
    }
    termOut.scrollTop = termOut.scrollHeight;
    termIn.focus();
  }
}
btnTerminal.addEventListener("click", () => setTerm(!termOpen));
termHead.addEventListener("click", () => setTerm(!termOpen));

function tprint(text, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text;
  termOut.appendChild(line);
  termOut.scrollTop = termOut.scrollHeight;
  return line;
}
function fmtBytes(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(0) + " MB";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + " kB";
  return n + " B";
}
function relTime(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " mins ago";
  if (s < 86400) { const h = Math.floor(s / 3600); return h + (h === 1 ? " hour ago" : " hours ago"); }
  const d = Math.floor(s / 86400);
  return d + (d === 1 ? " day ago" : " days ago");
}
function pad(s, w) { s = String(s); return s.length >= w ? s + "  " : s + " ".repeat(w - s.length + 2); }

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
  return res.json();
}
async function streamProgress(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", cur = null, lastKey = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const s = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!s) continue;
      const d = JSON.parse(s);
      if (d.error) throw new Error(d.error);
      const key = d.digest || d.status || "";
      if (key !== lastKey) { cur = tprint(""); lastKey = key; }
      if (d.total) {
        const pct = ((d.completed || 0) / d.total * 100).toFixed(1);
        cur.textContent = `${d.status} — ${pct}% (${fmtBytes(d.completed || 0)} / ${fmtBytes(d.total)})`;
      } else {
        cur.textContent = d.status || "…";
      }
      termOut.scrollTop = termOut.scrollHeight;
    }
  }
}
async function streamGenerate(res) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  const line = tprint("");
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const s = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!s) continue;
      const d = JSON.parse(s);
      if (d.error) throw new Error(d.error);
      if (d.response) {
        line.textContent += d.response;
        termOut.scrollTop = termOut.scrollHeight;
      }
      if (d.done && d.eval_count > 0) {
        line.textContent += `\n[${d.eval_count} tok in ${(d.eval_duration / 1e9).toFixed(1)}s — avg ${(d.eval_count / (d.eval_duration / 1e9)).toFixed(1)} tok/s]`;
      }
    }
  }
}

async function maybeRefreshModels() {
  if (!connected) await listModels();
}

async function termExec(raw) {
  const input = raw.trim();
  tprint(`ollama> ${input}`, "t-cmd");
  if (!input) return;
  termHistory.unshift(input);
  termHistIdx = -1;
  let parts = input.split(/\s+/);
  let cmd = parts[0].toLowerCase();
  if (cmd === "ollama") cmd = (parts[1] || "").toLowerCase(), parts = parts.slice(1);
  const args = parts.slice(1);
  try {
    switch (cmd) {
      case "help":
        tprint([
          "Commands (the 'ollama' prefix is optional):",
          "  list                     list models on disk (= ollama list)",
          "  ps                       show models currently in memory",
          "  pull <model>             download a model from the registry",
          "  rm <model>               delete a model from disk",
          "  cp <src> <dst>           copy a model",
          "  push <model>             push a model to the registry",
          "  show <model>             show model info (modelfile, parameters…)",
          "  run <model> <message>    one-shot generation (no interactive session here)",
          "  stop <model>             unload a model from memory",
          "  version                  show Ollama version",
          "  clear                    clear the terminal",
          "  exit | close             close the terminal",
          "  help                     this list"
        ].join("\n"));
        break;
      case "clear":
        termOut.innerHTML = "";
        break;
      case "exit": case "close":
        setTerm(false);
        break;
      case "version": {
        const d = await fetchJson(`${ollamaUrl}/api/version`);
        tprint(`ollama version is ${d.version}`, "t-ok");
        break;
      }
      case "list": {
        const d = await fetchJson(`${ollamaUrl}/api/tags`);
        const ms = (d.models || []).sort((a, b) => a.name.localeCompare(b.name));
        if (!ms.length) { tprint("no models installed — try: pull llama3.2", "t-dim"); break; }
        tprint(pad("NAME", 30) + pad("ID", 14) + pad("SIZE", 10) + "MODIFIED");
        for (const m of ms)
          tprint(pad(m.name, 30) + pad((m.digest || "").slice(0, 12), 14) + pad(fmtBytes(m.size || 0), 10) + relTime(m.modified_at));
        break;
      }
      case "ps": {
        const d = await fetchJson(`${ollamaUrl}/api/ps`);
        const ms = d.models || [];
        if (!ms.length) { tprint("no models in memory — press Connect in the chat or run: run <model> <message>", "t-dim"); break; }
        tprint(pad("NAME", 30) + pad("ID", 14) + pad("SIZE", 10) + pad("PROCESSOR", 16) + "UNTIL");
        for (const m of ms) {
          const pct = m.size ? Math.round((m.size_vram || 0) / m.size * 100) : 0;
          tprint(pad(m.name, 30) + pad((m.digest || "").slice(0, 12), 14) + pad(fmtBytes(m.size || 0), 10) + pad(`${pct}% GPU/${100 - pct}% CPU`, 16) + (m.expires_at ? new Date(m.expires_at).toLocaleTimeString() : ""));
        }
        break;
      }
      case "pull": {
        if (!args[0]) throw new Error("usage: pull <model>");
        await streamProgress(`${ollamaUrl}/api/pull`, { model: args[0], stream: true });
        tprint(`pulled '${args[0]}'`, "t-ok");
        await maybeRefreshModels();
        break;
      }
      case "push": {
        if (!args[0]) throw new Error("usage: push <model>");
        await streamProgress(`${ollamaUrl}/api/push`, { model: args[0], stream: true });
        tprint(`pushed '${args[0]}'`, "t-ok");
        break;
      }
      case "rm": {
        if (!args[0]) throw new Error("usage: rm <model>");
        const res = await fetch(`${ollamaUrl}/api/delete`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: args[0] })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
        tprint(`deleted '${args[0]}'`, "t-ok");
        await maybeRefreshModels();
        break;
      }
      case "cp": {
        if (!args[0] || !args[1]) throw new Error("usage: cp <source> <destination>");
        await fetchJson(`${ollamaUrl}/api/copy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: args[0], destination: args[1] })
        });
        tprint(`copied '${args[0]}' -> '${args[1]}'`, "t-ok");
        await maybeRefreshModels();
        break;
      }
      case "show": {
        if (!args[0]) throw new Error("usage: show <model>");
        const d = await fetchJson(`${ollamaUrl}/api/show`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: args[0] })
        });
        const out = [];
        if (d.modelfile) out.push("# Modelfile\n" + d.modelfile.trim());
        if (d.parameters) out.push("# Parameters\n" + d.parameters.trim());
        if (d.capabilities) out.push("# Capabilities\n" + JSON.stringify(d.capabilities));
        if (!out.length) out.push(JSON.stringify(d, null, 2).split("\n").slice(0, 60).join("\n"));
        tprint(out.join("\n\n"));
        break;
      }
      case "stop": {
        if (!args[0]) throw new Error("usage: stop <model>");
        await fetchJson(`${ollamaUrl}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: args[0], prompt: "", keep_alive: 0 })
        });
        tprint(`unloaded '${args[0]}' from memory`, "t-ok");
        break;
      }
      case "run": {
        if (!args[0]) throw new Error("usage: run <model> <message>");
        const prompt = args.slice(1).join(" ");
        if (!prompt) {
          tprint("note: no interactive session in the web terminal — use 'run <model> <message>' for a one-shot answer, or the chat above", "t-dim");
          break;
        }
        const res = await fetch(`${ollamaUrl}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: args[0], prompt, stream: true })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
        await streamGenerate(res);
        await maybeRefreshModels();
        break;
      }
      default:
        tprint(`command not found: ${cmd} — type 'help'`, "t-err");
    }
  } catch (err) {
    tprint(`error: ${err.message}`, "t-err");
  }
  termOut.scrollTop = termOut.scrollHeight;
}

termIn.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const v = termIn.value;
    termIn.value = "";
    termExec(v);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (termHistIdx < termHistory.length - 1) {
      termHistIdx++;
      termIn.value = termHistory[termHistIdx];
    }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (termHistIdx > 0) {
      termHistIdx--;
      termIn.value = termHistory[termHistIdx];
    } else {
      termHistIdx = -1;
      termIn.value = "";
    }
  }
});

listModels();
msgInput.focus();
</script>
